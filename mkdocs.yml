site_name: picoCTF2026 Writeups
site_description: Writeups for picoCTF 2026.
strict: true

theme:
  name: material
  favicon: assets/site-icon.svg
  logo: assets/site-icon.svg
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - toc.follow

nav:
  - Problems:
      - ClusterRSA: problems/clusterrsa.md
      - Not TRUe: problems/not-true.md
      - paper-2: problems/paper-2.md
  - AI Usage: ai-usage-report.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
